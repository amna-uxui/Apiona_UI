<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Camille M. · Apiona</title>
  <link rel="stylesheet" href="style.css?v=consult-1">
</head>
<body>
  <main class="stage">

    <!-- Left: where am I in the product. Plain text on white, full height, so it never reads like the index. -->
    <nav class="rail" id="rail" aria-label="Main">
      <a class="rail-logo" href="./" aria-label="Apiona">
        <img class="logo-full" src="../../design/logo/colours/apiona-logo-teal.svg" alt="">
        <img class="logo-icon" src="../../design/logo/colours/apiona-icon-teal.svg" alt="">
      </a>

      <ul class="rail-list">
        <li><a class="rail-item is-soon" aria-disabled="true" title="Schedule · not built yet"><svg class="i"><use href="#i-calendar"/></svg><span class="r-label">Schedule</span></a></li>
        <li>
          <a class="rail-item" aria-disabled="true" title="Patients"><svg class="i"><use href="#i-users"/></svg><span class="r-label">Patients</span></a>
          <!-- a tree: Patients › Camille M. › her pages -->
          <div class="patient-tree">
            <a class="rail-patient" href="./" title="Camille M.">
              <span class="mini-photo"><img src="../../ui/assets/patient.jpg" alt="" data-initials="CM"></span><span class="r-label">Camille M.</span>
            </a>
            <ol class="pages">
              <li><a class="page is-current" href="./" aria-current="page" data-page="summary">Summary</a></li>
              <li><a class="page" href="#consultation" data-page="consultation">Consultation</a></li>
              <li><a class="page is-soon" aria-disabled="true" title="Not built yet">Follow-up</a></li>
              <li><a class="page is-soon" aria-disabled="true" title="Not built yet">Documents</a></li>
            </ol>
          </div>
        </li>
        <li><a class="rail-item is-soon" aria-disabled="true" title="Billing · not built yet"><svg class="i"><use href="#i-receipt"/></svg><span class="r-label">Billing</span></a></li>
      </ul>

      <ul class="rail-list rail-bottom">
        <li><a class="rail-item is-soon" aria-disabled="true" title="Settings · not built yet"><svg class="i"><use href="#i-settings"/></svg><span class="r-label">Settings</span></a></li>
        <li><a class="rail-item is-soon" aria-disabled="true" title="Your profile · not built yet">
          <span class="mini-photo"><img src="../../ui/assets/practitioner.jpg" alt="" data-initials="You"></span><span class="r-label">Your profile</span></a></li>
      </ul>

      <!-- the fold handle sits on the menu's edge -->
      <button class="rail-handle" id="rail-toggle" aria-expanded="true" aria-controls="rail" title="Collapse the menu">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5"/></svg>
      </button>
    </nav>

    <!-- Always visible: who she is and why she is here. Never behind a click. -->
    <header class="brief">
      <div class="who">
        <!-- photo of a real person: it stays on this Mac (ui/assets is not in git) -->
        <span class="photo"><img src="../../ui/assets/patient.jpg" alt="" data-initials="CM"><span class="new" id="p-new">New</span></span>
        <span class="who-text">
          <h1 class="name" id="p-name"></h1>
          <span class="meta" id="p-meta"></span>
          <span class="occupation" id="p-occ"></span>
        </span>
      </div>
      <ul class="tags" id="p-tags"></ul>
      <p class="brief-text" id="p-brief"></p>
    </header>

    <!-- The network: a few nodes at a time, re-arranged around what you select -->
    <section class="map" id="map" aria-label="Camille's record as a network">
      <div class="world" id="world">
        <svg class="lines" id="lines" aria-hidden="true"></svg>
        <div class="nodes" id="nodes"></div>
      </div>
    </section>

    <!-- Images of the selected record, shown as a small pile of prints (after the reference) -->
    <figure class="media" id="media" aria-live="polite" hidden></figure>
    <div class="veil" id="veil" aria-hidden="true"></div>

    <!-- while a file is dragged over the page -->
    <div class="ghost" id="ghost" aria-hidden="true"><svg class="i"><use href="#i-file-text"/></svg></div>
    <p class="drop-hint" id="drop-hint" aria-live="polite">Drop it on a point of the record</p>

    <!-- Consultation in progress: replaces the summary and the network; the index stays on the right -->
    <section class="consult" id="consult" aria-label="Consultation in progress" hidden>
      <header class="c-bar reveal" style="--d:0">
        <button class="c-back" type="button" data-to-summary>← Summary</button>
        <div class="c-title">
          <h2>Consultation · Camille M.</h2>
          <p>Session 1 of 9 · Accident · mid-foot sprain · <span class="c-saved">draft saved</span> · <span class="c-clock" id="c-clock">00:00</span></p>
        </div>
        <div class="c-tools">
          <div class="seg" role="radiogroup" aria-label="Attendance">
            <button role="radio" aria-checked="true" class="is-on">Present</button>
            <button role="radio" aria-checked="false">Absent, billable</button>
            <button role="radio" aria-checked="false">Absent, excused</button>
          </div>
          <button class="c-dictate" type="button"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="1.5" width="5" height="8.5" rx="2.5"/><path d="M3 7.5a5 5 0 0 0 10 0M8 12.5V15"/></svg>Dictate</button>
        </div>
      </header>

      <div class="c-type reveal" style="--d:1">
        <div class="seg" role="radiogroup" aria-label="Assessment type">
          <button role="radio" aria-checked="true" class="is-on">Initial assessment</button>
          <button role="radio" aria-checked="false">Intermediate</button>
          <button role="radio" aria-checked="false">Final</button>
        </div>
        <label class="c-date">Assessment date <input type="text" placeholder="dd.mm.yyyy" inputmode="numeric"></label>
      </div>

      <ol class="c-steps reveal" style="--d:2" id="c-steps"></ol>
      <div class="c-sections" id="c-sections"></div>
    </section>

    <button class="start" type="button"><span>Start consultation</span><svg class="arrow" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 8h11M9 4l4 4-4 4"/></svg></button>

    <!-- Side: the index, the same record as a list -->
    <aside class="side" aria-label="Index">
      <section class="panel index" id="index">
        <button class="panel-head" id="index-toggle" aria-expanded="true" aria-controls="index-body">
          <i class="head-icon"></i><span>Index</span><span class="chev" aria-hidden="true"></span>
        </button>
        <div class="index-body" id="index-body"></div>
      </section>
    </aside>

  </main>

  <script src="../../design/icons.js?v=consult-1"></script>
  <script src="data.js?v=consult-1"></script>
  <script src="app.js?v=consult-1"></script>
</body>
</html>
