<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Camille M. · Apiona</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">

    <!-- Always visible: who she is and why she is here. Never behind a click. -->
    <header class="brief">
      <div class="brief-top">
        <img class="logo" src="../../design/logo/colours/apiona-logo-teal.svg" alt="Apiona">
      </div>
      <div class="who">
        <!-- photo of a real person: it stays on this Mac (ui/assets is not in git) -->
        <span class="photo"><img src="../../ui/assets/patient.jpg" alt=""><span class="new" id="p-new">New</span></span>
        <span class="who-text">
          <h1 class="name" id="p-name"></h1>
          <span class="meta" id="p-meta"></span>
        </span>
      </div>
      <ul class="tags" id="p-tags"></ul>
      <p class="brief-text" id="p-brief"></p>
    </header>

    <!-- The network: a few nodes at a time, re-arranged around what you select -->
    <section class="map" id="map" aria-label="Camille's record as a network">
      <div class="world" id="world">
        <svg class="lines" id="lines" aria-hidden="true"></svg>
        <div class="nodes" id="nodes"></div>
      </div>
    </section>

    <button class="start" type="button"><span>Start consultation</span><svg class="arrow" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 8h11M9 4l4 4-4 4"/></svg></button>

    <!-- Side: the index, the same record as a list -->
    <aside class="side" aria-label="Index">
      <section class="panel index" id="index">
        <button class="panel-head" id="index-toggle" aria-expanded="true" aria-controls="index-body">
          <i class="head-icon"></i><span>Index</span><span class="chev" aria-hidden="true"></span>
        </button>
        <div class="index-body" id="index-body"></div>
      </section>
    </aside>

  </main>

  <script src="../../design/icons.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
